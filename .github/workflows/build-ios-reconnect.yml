name: Build iOS VK Mobile v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ios-reconnect.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout upstream main
        uses: actions/checkout@v4
        with:
          repository: kulikov0/whitelist-bypass
          ref: main
          fetch-depth: 0

      - name: Apply iOS reconnect PR 174
        run: |
          git fetch https://github.com/Jynk0-btw/whitelist-bypass.git ios-reconnect
          git cherry-pick 07924ecda7924d2198202d88bd6a68ed9d83b669

      - name: Apply VK iOS mobile fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def must_sub(text, pattern, repl, label):
              out, n = re.subn(pattern, repl, text, count=1)
              if n != 1:
                  raise SystemExit(f"ERROR: {label}: expected 1 match, got {n}")
              return out

          vk_path = Path("relay/pion/headless-joiner-common/vk_joiner.go")
          vk = vk_path.read_text()

          vk = must_sub(vk, r"(\tdualTrack\s+bool\n)(\tremoteSet\s+bool)", lambda m: m.group(1) + "\tforceRelay     bool\n" + m.group(2), "VK forceRelay field")

          marker = "func (h *VKHeadlessJoiner) MarkConfigAcked() { h.configAck.mark() }"
          if marker not in vk:
              raise SystemExit("ERROR: MarkConfigAcked not found")
          vk = vk.replace(marker, marker + "\n\nfunc (h *VKHeadlessJoiner) SetForceRelay(enabled bool) {\n\th.forceRelay = enabled\n}", 1)

          pc_pattern = r"\tpc, err := webrtc\.NewAPI\(webrtc\.WithSettingEngine\(settingEngine\)\)\.NewPeerConnection\(webrtc\.Configuration\{\n\t\tICEServers: iceServers,\n\t\}\)"
          pc_repl = "\tpcConfig := webrtc.Configuration{ICEServers: iceServers}\n\tif h.forceRelay {\n\t\tpcConfig.ICETransportPolicy = webrtc.ICETransportPolicyRelay\n\t\th.logFn(\"vk-joiner: ICE policy: RELAY (Force TURN enabled)\")\n\t}\n\tpc, err := webrtc.NewAPI(webrtc.WithSettingEngine(settingEngine)).NewPeerConnection(pcConfig)"
          vk = must_sub(vk, pc_pattern, lambda m: pc_repl, "VK PeerConnection")

          vk_path.write_text(vk)

          ios_path = Path("relay/pion/ios/mobile.go")
          ios = ios_path.read_text()
          ios_old = "\tvkJoiner := joiner.NewVKHeadlessJoiner(logFn, resolveFn, statusEmitter, nil, pion.AddTunnelTracks, pion.ReadTrack)\n\tvkJoiner.OnConnected = makeOnConnected(socksPort, socksUser, socksPass, logFn, callback, vkJoiner.MarkConfigAcked)"
          ios_new = "\tvkJoiner := joiner.NewVKHeadlessJoiner(logFn, resolveFn, statusEmitter, nil, pion.AddTunnelTracks, pion.ReadTrack)\n\tvkJoiner.SetForceRelay(true)\n\tlogFn(\"ios: VK Force TURN relay ENABLED\")\n\tvkJoiner.OnConnected = makeOnConnected(socksPort, socksUser, socksPass, logFn, callback, vkJoiner.MarkConfigAcked)"
          if ios_old not in ios:
              raise SystemExit("ERROR: iOS VK joiner block not found")
          ios_path.write_text(ios.replace(ios_old, ios_new, 1))

          swift_path = Path("ios-proxy-app/whitelist-bypass-proxy/ProxyManager.swift")
          swift = swift_path.read_text()

          replacements = [
              ("        startSupervisor()\n        launchHeadless()", "        detectedPlatform = CallPlatform.detect(url: callUrl)\n        if detectedPlatform == .vk {\n            stopSupervisor()\n            appendLog(\"VK Mobile v2: Go reconnect active; outer restart disabled\")\n        } else {\n            startSupervisor()\n        }\n        launchHeadless()", "supervisor start"),
              ("            if isArmed {\n                // The Go joiner gives up for good if the very first attempt fails, so the\n                // restart has to come from here.\n                scheduleRestart(reason: errorText)\n            } else {\n                isRunning = false\n            }", "            if isArmed && detectedPlatform != .vk {\n                scheduleRestart(reason: errorText)\n            } else {\n                isRunning = false\n                if detectedPlatform == .vk {\n                    appendLog(\"VK Mobile v2: full auth restart suppressed to avoid CAPTCHA loop\")\n                }\n            }", "ERROR restart"),
              ("    private func supervisorTick() {\n        guard isArmed else { return }\n        guard status != .tunnelConnected else { return }", "    private func supervisorTick() {\n        guard isArmed else { return }\n        guard detectedPlatform != .vk else { return }\n        guard status != .tunnelConnected else { return }", "supervisorTick"),
              ("    private func scheduleRestart(reason: String) {\n        guard isArmed, pendingRestart == nil else { return }", "    private func scheduleRestart(reason: String) {\n        guard isArmed, detectedPlatform != .vk, pendingRestart == nil else { return }", "scheduleRestart"),
              ("    private func restartNow(reason: String) {\n        guard isArmed else { return }", "    private func restartNow(reason: String) {\n        guard isArmed, detectedPlatform != .vk else { return }", "restartNow"),
              ("    @objc private func appDidBecomeActive() {\n        guard isArmed, status != .tunnelConnected else { return }", "    @objc private func appDidBecomeActive() {\n        guard isArmed, detectedPlatform != .vk, status != .tunnelConnected else { return }", "foreground restart"),
          ]

          for old, new, label in replacements:
              if old not in swift:
                  raise SystemExit(f"ERROR: Swift {label} block not found")
              swift = swift.replace(old, new, 1)

          swift_path.write_text(swift)
          print("VK Mobile v2 patch applied")
          print("iOS VK Force TURN: ON")
          print("Outer Swift VK restart: OFF")
          print("Internal Go VK reconnect: ON")
          PY

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Prepare dependencies
        run: |
          cd relay
          go mod download
          go mod tidy
          cd ..

      - name: Build IPA
        run: |
          chmod +x build-ios.sh
          ./build-ios.sh

      - name: Verify IPA
        run: |
          ls -lah prebuilts/
          test -f prebuilts/whitelist-bypass-proxy.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: whitelist-bypass-ios-v2-vk-mobile
          path: prebuilts/whitelist-bypass-proxy.ipa
          if-no-files-found: error
